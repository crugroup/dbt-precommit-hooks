- id: dbt-compile
  name: dbt compile (parse)
  description: >-
    Parse the dbt project against a throwaway CI profile so model/macro/YAML
    errors are caught before commit. No warehouse connection is made.
  entry: dbt-compile
  language: python
  pass_filenames: false
  files: \.(sql|yml|yaml)$
  additional_dependencies:
    - dbt-core==2.0.0b2
    - msgpack
    - mashumaro

- id: sqlfluff-lint
  name: sqlfluff lint (dbt templater)
  description: >-
    Lint dbt models with SQLFluff's dbt templater against a throwaway CI profile.
    No warehouse connection is made.
  entry: sqlfluff-lint
  language: python
  types: [sql]
  additional_dependencies:
    - sqlfluff-templater-dbt==4.3.0
    - dbt-core~=1.12.0
    - dbt-duckdb~=1.11.0

- id: sqlfluff-fix
  name: sqlfluff fix (dbt templater)
  description: Same as sqlfluff-lint, but applies fixes in place.
  entry: sqlfluff-fix
  language: python
  types: [sql]
  additional_dependencies:
    - sqlfluff-templater-dbt==4.3.0
    - dbt-core~=1.12.0
    - dbt-duckdb~=1.11.0
