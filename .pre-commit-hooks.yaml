- id: dbt-compile
  name: dbt compile (parse)
  description: >-
    Parse the dbt project against a throwaway CI profile so model/macro/YAML
    errors are caught before commit. No warehouse connection is made.
  entry: dbt-compile
  language: python
  pass_filenames: false
  files: \.(sql|yml|yaml)$
  additional_dependencies:
    - dbt==2.0.9

- id: dbt-lint
  name: dbt lint
  description: >-
    Lint dbt models with the dbt Fusion linter against a throwaway CI profile.
    No warehouse connection is made.
  entry: dbt-lint
  language: python
  types: [sql]
  additional_dependencies:
    - dbt==2.0.9

- id: dbt-format
  name: dbt format
  description: >-
    Format the project's SQL in place with the dbt Fusion formatter against a
    throwaway CI profile. No warehouse connection is made.
  entry: dbt-format
  language: python
  pass_filenames: false
  files: \.sql$
  additional_dependencies:
    - dbt==2.0.9

- id: dbt-autofix-check
  name: dbt-autofix (check)
  description: >-
    Fail when dbt-autofix would rewrite the project, e.g. a model's YAML using
    the dbt_project.yml spelling `pre-hook` instead of `pre_hook`. Dry run:
    nothing is written and no profile is needed.
  entry: dbt-autofix-check
  language: python
  pass_filenames: false
  files: \.(sql|yml|yaml)$
  additional_dependencies:
    - dbt-autofix==0.22.6
